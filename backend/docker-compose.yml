services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wash_world_exam
    depends_on:
      - mariadb
    ports:
      - "80:80"
    volumes:
      - .:/app
  mariadb:
    image: mariadb:10.6.20
    container_name: wash_world_exam_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wash_world_exam
      TZ: Europe/Copenhagen
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wash_world_exam_phpmyadmin
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8080:80"
volumes:
  mariadb_data: